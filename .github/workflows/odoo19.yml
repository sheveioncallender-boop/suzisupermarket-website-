name: Odoo 19 Community validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-and-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        run: python3 scripts/check_module.py
      - name: Install and exercise native website routes
        run: |
          docker volume create suzi-ci-data
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            -v suzi-ci-data:/var/lib/odoo \
            odoo:19.0 odoo \
            --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
            -d suzi_ci --init=suzi_supermarket_website --without-demo=all \
            --test-enable --test-tags=/suzi_supermarket_website \
            --stop-after-init --http-interface=127.0.0.1 --log-level=test
      - name: Upgrade and rerun regressions
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            -v suzi-ci-data:/var/lib/odoo \
            odoo:19.0 odoo \
            --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
            -d suzi_ci --update=suzi_supermarket_website \
            --test-enable --test-tags=/suzi_supermarket_website \
            --stop-after-init --http-interface=127.0.0.1 --log-level=test
